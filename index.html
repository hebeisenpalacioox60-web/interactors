<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="manifest" href="manifest.json">
  <!-- 声明允许在移动端/平板端全屏独立运行，剥离浏览器顶栏 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的交互工具箱</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card-bg: #ffffff;
      --card-border: rgba(15, 23, 42, 0.08);
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --chip-text: #4f46e5;
      --chip-bg: rgba(79, 70, 229, 0.08);
      --chip-border: rgba(79, 70, 229, 0.18);
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04), 0 6px 16px rgba(15, 23, 42, 0.06);
      --shadow-lg: 0 6px 12px rgba(15, 23, 42, 0.08), 0 20px 40px rgba(15, 23, 42, 0.14);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1020;
        --card-bg: #161d33;
        --card-border: rgba(148, 163, 184, 0.16);
        --text-primary: #e2e8f0;
        --text-secondary: #94a3b8;
        --chip-text: #a5b4fc;
        --chip-bg: rgba(129, 140, 248, 0.12);
        --chip-border: rgba(129, 140, 248, 0.28);
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 16px rgba(0, 0, 0, 0.35);
        --shadow-lg: 0 6px 12px rgba(0, 0, 0, 0.4), 0 20px 40px rgba(0, 0, 0, 0.5);
      }
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      margin: 0;
      min-height: 100vh;
      padding: 56px 24px 72px;
      color: var(--text-primary);
      background-color: var(--bg);
      display: flex;
      justify-content: center;
    }

    /* 背景装饰光斑，营造柔和的层次感 */
    body::before,
    body::after {
      content: "";
      position: fixed;
      z-index: -1;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
    }
    body::before {
      width: 480px;
      height: 480px;
      top: -160px;
      left: -120px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.20), transparent 70%);
    }
    body::after {
      width: 540px;
      height: 540px;
      right: -160px;
      bottom: -200px;
      background: radial-gradient(circle, rgba(14, 165, 233, 0.18), transparent 70%);
    }

    .container {
      width: 100%;
      max-width: 1080px;
      animation: fadeUp 0.5s ease backwards;
    }

    header { margin-bottom: 36px; }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 16px;
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--chip-text);
      background: var(--chip-bg);
      border: 1px solid var(--chip-border);
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.6rem, 4vw, 2.1rem);
      letter-spacing: 0.02em;
      background: linear-gradient(120deg, #4f46e5, #0ea5e9 55%, #8b5cf6);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      margin: 0;
      font-size: 0.95rem;
      color: var(--text-secondary);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .card {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 24px 22px;
      border-radius: 18px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow-sm);
      text-decoration: none;
      color: inherit;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
      animation: fadeUp 0.55s cubic-bezier(0.22, 0.61, 0.36, 1) backwards;
    }
    .card:nth-child(1) { animation-delay: 0.08s; }
    .card:nth-child(2) { animation-delay: 0.16s; }
    .card:nth-child(3) { animation-delay: 0.24s; }
    .card:nth-child(n+4) { animation-delay: 0.32s; }

    .card:hover {
      transform: translateY(-5px);
      border-color: var(--accent-border);
      box-shadow: var(--shadow-lg);
    }
    .card:active { transform: scale(0.98); }
    .card:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    /* 每张卡片各有一个主题色：橙=机构、蓝=函数、紫=不等式、绿=集合 */
    .card-mechanism  { --accent: #f59e0b; --accent-border: rgba(245, 158, 11, 0.55); --icon-bg: linear-gradient(135deg, #f59e0b, #f97316); }
    .card-function   { --accent: #0ea5e9; --accent-border: rgba(14, 165, 233, 0.55); --icon-bg: linear-gradient(135deg, #0ea5e9, #6366f1); }
    .card-inequality { --accent: #8b5cf6; --accent-border: rgba(139, 92, 246, 0.55); --icon-bg: linear-gradient(135deg, #8b5cf6, #ec4899); }
    .card-set        { --accent: #10b981; --accent-border: rgba(16, 185, 129, 0.55); --icon-bg: linear-gradient(135deg, #10b981, #14b8a6); }

    .icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: var(--icon-bg);
      color: #ffffff;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28), 0 8px 16px -8px var(--accent);
      transition: transform 0.18s ease;
    }
    .card:hover .icon { transform: scale(1.08) rotate(-4deg); }
    .icon svg { width: 26px; height: 26px; }

    .card h3 {
      margin: 0 0 6px;
      font-size: 1.12rem;
      font-weight: 700;
    }
    .card p {
      margin: 0;
      font-size: 0.88rem;
      line-height: 1.6;
      color: var(--text-secondary);
    }

    .go {
      margin-top: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--accent);
    }
    .go .arrow { transition: transform 0.18s ease; }
    .card:hover .go .arrow { transform: translateX(4px); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .container, .card, .icon, .go .arrow { animation: none; transition: none; }
    }

    @media (max-width: 480px) {
      body { padding: 40px 18px 56px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <span class="chip">🧰 共 <b id="toolCount">4</b> 个交互器</span>
      <h1>🛠️ 我的交互工具箱</h1>
      <p class="subtitle">选择一个交互器，点击卡片进入全屏交互操作</p>
    </header>

    <main class="grid">
      <!-- 机构运动仿真器入口 -->
      <a class="card card-mechanism" href="tool1.html">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94a7.07 7.07 0 0 0 0-1.88l2.03-1.58a.5.5 0 0 0 .12-.61l-1.92-3.32a.5.5 0 0 0-.59-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.49.49 0 0 0-.48-.41h-3.84a.49.49 0 0 0-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.5.5 0 0 0-.59.22L2.74 8.87a.5.5 0 0 0 .12.61l2.03 1.58a7.07 7.07 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.04.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.5.5 0 0 0-.12-.61l-2.03-1.58zM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2z"/></svg>
        </span>
        <div>
          <h3>机构运动仿真器</h3>
          <p>机构的运动过程可视化演示</p>
        </div>
        <span class="go">进入全屏操作 <span class="arrow">→</span></span>
      </a>

      <!-- 初等函数仿真器入口 -->
      <a class="card card-function" href="basic-elementary-functions.html">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4v15h15"/><path d="M7.5 16c1.6-7 4-7 5.6 0s4 7 5.6 0"/></svg>
        </span>
        <div>
          <h3>初等函数仿真器</h3>
          <p>绘制并探索初等函数的图像</p>
        </div>
        <span class="go">进入全屏操作 <span class="arrow">→</span></span>
      </a>

      <!-- 不等式交互器入口 -->
      <a class="card card-inequality" href="inequality.html">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 19L19 5"/><path d="M5 9h14"/><path d="M5 15h14"/></svg>
        </span>
        <div>
          <h3>不等式交互器</h3>
          <p>基本不等式的几何证明与互动探究</p>
        </div>
        <span class="go">进入全屏操作 <span class="arrow">→</span></span>
      </a>

      <!-- 集合与区间交互器入口 -->
      <a class="card card-set" href="set-and-interval.html">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="12" r="6"/><circle cx="15" cy="12" r="6"/></svg>
        </span>
        <div>
          <h3>集合与区间</h3>
          <p>集合的 Venn 图与数轴区间可视化</p>
        </div>
        <span class="go">进入全屏操作 <span class="arrow">→</span></span>
      </a>
    </main>
  </div>

  <script>
    // 自动统计交互器数量，以后新增卡片无需手动改这里的数字
    document.getElementById('toolCount').textContent = document.querySelectorAll('.card').length;
  </script>
</body>
</html>
